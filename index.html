<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F4D3A">
<title>Validade</title>
<style>
:root{--bg:#F3F6F2;--card:#fff;--ink:#17261F;--mute:#5B6B63;--line:#DCE5DF;--ok:#2F7D4F;--soon:#B86E00;--late:#B3261E;--acc:#1F4D3A;--on:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root{--bg:#101814;--card:#18231D;--ink:#E7EFEA;--mute:#9BB0A5;--line:#2A3A31;--ok:#5CBF86;--soon:#F0B040;--late:#FF7A70;--acc:#5CBF86;--on:#0B1510}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
header{padding:20px 18px 4px}h1{font-size:28px;margin:0;letter-spacing:-.02em}
#sum{margin:4px 0 0;color:var(--mute);font-size:15px}
button{font:inherit;color:inherit;cursor:pointer}
main{padding:0 14px;max-width:640px;margin:0 auto}
h2{font-size:14px;color:var(--mute);margin:22px 4px 8px;font-weight:600}
.item{display:grid;grid-template-columns:6px 56px 1fr auto;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px 12px 0;margin-bottom:8px;overflow:hidden}
.rail{align-self:stretch;background:var(--ok)}.late .rail{background:var(--late)}.soon .rail{background:var(--soon)}
.ph{width:56px;height:56px;border-radius:8px;object-fit:cover;background:var(--line)}
.name{font-weight:600;overflow-wrap:anywhere}.date{color:var(--mute);font-size:14px;margin-top:2px}
.btn{margin-top:8px;margin-right:6px;background:none;border:1px solid var(--line);border-radius:8px;padding:5px 11px;font-size:14px}
.use{border-color:var(--acc);color:var(--acc);font-weight:600}
.days{text-align:right;min-width:60px;color:var(--ok)}.soon .days{color:var(--soon)}.late .days{color:var(--late)}
.big{font-size:30px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}.small{font-size:13px;margin-top:3px}
.usedrow{opacity:.7}.usedrow .name{text-decoration:line-through}.usedrow .rail{background:var(--line)}
.empty{background:var(--card);border:1px dashed var(--line);border-radius:12px;padding:24px 18px;color:var(--mute);margin-top:20px}
#snap{position:fixed;left:14px;right:14px;max-width:612px;margin:0 auto;bottom:calc(14px + env(safe-area-inset-bottom,0px));background:var(--acc);color:var(--on);border:0;border-radius:14px;padding:16px;font-weight:700;font-size:17px}
dialog{border:0;border-radius:16px;padding:20px;width:min(92vw,420px);background:var(--card);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.45)}
#pv{width:100%;max-height:180px;object-fit:cover;border-radius:10px;background:var(--line)}
#st{color:var(--mute);font-size:14px;margin:10px 0 0}
label{display:block;font-weight:600;margin:14px 0 6px}
input{width:100%;font:inherit;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.row{display:flex;gap:8px;margin-top:20px}.row button{flex:1;padding:13px;border-radius:12px;border:1px solid var(--line);background:none;font-weight:600}
.row .pri{background:var(--acc);color:var(--on);border-color:var(--acc)}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
</style>
</head>
<body>
<header><h1>Validade</h1><p id="sum"></p></header>
<main id="list"></main>
<button id="snap">Fotografar a validade</button>
<input id="file" type="file" accept="image/*" capture="environment" hidden>

<dialog id="dAdd"><form id="fAdd">
  <img id="pv" alt="Foto da validade">
  <p id="st"></p>
  <label for="dt">Data de validade</label><input id="dt" type="date" required>
  <label for="nm">Nome do produto (opcional)</label><input id="nm" maxlength="60" placeholder="Ex.: Iogurte natural" autocomplete="off">
  <div class="row"><button type="button" id="cAdd">Cancelar</button><button class="pri" type="submit">Salvar e avisar 5 dias antes</button></div>
</form></dialog>

<script src="app.js"></script>
</body>
</html>
